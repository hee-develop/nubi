# 주행 기록 E2E. 서버가 떠 있고 debug 앱이 설치된 emulator-5554에서 돈다(scripts/e2e-car.sh가 서버·설치·권한 부여를 맡는다).
# 신호·위치는 debug 빌드의 nubi-debug://signal 주소로 넣는다(reset, real, gear, gpx, now, flush). 속도는 수집하지 않는다.
# 스크린샷은 ${SHOT_DIR} 아래에 남긴다. CLOCK_PLUS_6MIN(env 기본값을 두면 -e보다 우선해 0이 되므로 두지 않는다)은 스크립트가 넘기는 "지금 + 6분"(epoch ms)이다.
# APP_VIN(스크립트가 -e로 넘김)은 vin= 주입으로 서버 차량 ID를 받게 하는 값이다(앱 데이터를 pm clear 한 뒤에도 서버 발급 ID를 쓰려고. 에뮬레이터 VIN은 서버 형식 검사에 걸린다).
# 글자 검증은 정규식(전체 일치)이다. clearState는 쓰지 않는다(앱이 사용자 10에서 돌아 데이터가 지워지지 않는다). 초기화는 reset=1로 한다.
appId: com.nubi.car
name: 주행 기록
env:
  SHOT_DIR: e2e/output/car
---
# 1. 앱을 켜고(권한은 스크립트가 pm grant로 미리 줌) 상태를 비운다 → 대기
- launchApp
- openLink: nubi-debug://signal?reset=1&vin=${APP_VIN}
- extendedWaitUntil:
    visible: '대기'
    timeout: 20000
- assertNotVisible: '권한 필요'
# 정차 화면(시안 03): 헤더 칩, 정차 메뉴 탭, 게스트 QR 카드(같이 탄 사람 추가, '준비 중' 표기 없음), 오른쪽 이웃 카드 틀
- assertVisible: '정차 중.*'
- assertVisible: '게스트 QR'
- assertVisible: '같이 탄 사람 추가'
- assertNotVisible: '준비 중'
- assertVisible: '도감'
- assertVisible: '오늘'
- assertVisible: '설정'
# 정차 지도(사양 05a): 지도와 패널이 함께 보이고(패널의 게스트 QR이 위에서 이미 보임), 지도 버튼·레이어 토글이 있다.
# 지도 뷰의 요약(contentDescription)은 debug 빌드에서만 있다: way=그린 way 수, live=잠정 way 수, new=처음 달린 잠정 way 수
- extendedWaitUntil:
    visible: '지도 way=.* roads=on regions=on .*'
    timeout: 20000
- assertVisible: '도로'
- assertVisible: '시군구'
- assertVisible: '내 위치'
- assertVisible: '전국'
- assertVisible: '\+'
- assertVisible: '−'
- takeScreenshot: ${SHOT_DIR}/01-idle

# 2. 기어 D → 위치 30점(약 725m)을 1초 간격으로 재생. reset이 실제 위치 스트림을 끈 뒤(앞 단계)에 gpx를 시작하므로 섞이지 않는다.
#    park=1: 재생이 끝나면 기어가 P로 바뀐다(숫자는 기어 P에서만 보이므로 이걸로 재생 끝을 안다)
- openLink: nubi-debug://signal?gear=D
- openLink: nubi-debug://signal?gpx=e2e-north.gpx&park=1
- extendedWaitUntil:
    visible: '기록 중'
    timeout: 30000
# 기어 D인 동안 숫자(샘플·거리·전국 완료율)는 보이지 않는다(사양 02 7장)
- assertNotVisible: '샘플.*'
- assertNotVisible: '거리.*'
- assertNotVisible: '전국 .*'
# 주행 중 화면(사양 05a): 앱 영역 전체 지도 + 위 한 줄(기록 중 · 지금 시군구)뿐이고 카드·QR·버튼은 없다
- assertVisible: '지도 way=.*'
- assertNotVisible: '게스트 QR'
- assertNotVisible: '안 가 본 이웃'
- assertNotVisible: '길안내'
- assertNotVisible: '준비 중'
- assertNotVisible: '같이 탄 사람 추가'
- assertNotVisible: '도감'
- assertNotVisible: '오늘'
- assertNotVisible: '설정'
- assertNotVisible: '도로'
- assertNotVisible: '시군구'
- assertNotVisible: '내 위치'
- assertNotVisible: '전국'
- assertNotVisible: '\+'
- assertNotVisible: '−'
- assertNotVisible: '숫자와 지역 카드는 정차\(P\)하면 보여요'
# 지나온 길은 서버 응답을 기다리지 않고 로컬 궤적으로 바로 그려진다(점이 쌓이면 trail이 늘어난다)
- extendedWaitUntil:
    visible: '지도 .* trail=([5-9]|[1-9][0-9]+) .*'
    timeout: 30000
- takeScreenshot: ${SHOT_DIR}/02-recording

# 3. 재생이 끝나 기어 P가 되면 숫자가 보인다: 샘플 30, 거리 500m 이상
- extendedWaitUntil:
    visible: '샘플 30'
    timeout: 60000
- extendedWaitUntil:
    visible: '거리 (5[0-9][0-9]|[6-9][0-9][0-9]|[0-9]{4,})m'
    timeout: 20000
- takeScreenshot: ${SHOT_DIR}/03-samples

# 3-1. 정차 지도 조작: 레이어 토글(도로·시군구), 확대·축소, 전국, 내 위치. 지도와 패널(샘플·거리 줄)이 같은 화면에 있다
- assertVisible: '지도 way=.*'
# 정차 메뉴 탭 '도로'와 이름이 같아 레이어 토글은 id로 누른다
- tapOn:
    id: 'map_btn_roads'
- extendedWaitUntil:
    visible: '지도 .* roads=off .*'
    timeout: 10000
- assertVisible: '샘플 30'
- tapOn:
    id: 'map_btn_roads'
- extendedWaitUntil:
    visible: '지도 .* roads=on .*'
    timeout: 10000
- tapOn: '시군구'
- extendedWaitUntil:
    visible: '지도 .* regions=off .*'
    timeout: 10000
- tapOn: '시군구'
- extendedWaitUntil:
    visible: '지도 .* regions=on .*'
    timeout: 10000
- tapOn: '내 위치'
- extendedWaitUntil:
    visible: '지도 .* z=14\.0 follow=on'
    timeout: 10000
- tapOn: '\+'
- extendedWaitUntil:
    visible: '지도 .* z=15\.0 follow=off'
    timeout: 10000
- tapOn: '−'
- extendedWaitUntil:
    visible: '지도 .* z=14\.0 follow=off'
    timeout: 10000
- takeScreenshot: ${SHOT_DIR}/03-map-parked
- tapOn: '전국'
- extendedWaitUntil:
    visible: '지도 .* z=[78]\.[0-9] follow=off'
    timeout: 10000
- takeScreenshot: ${SHOT_DIR}/03-map-national
- tapOn: '내 위치'
- extendedWaitUntil:
    visible: '지도 .* z=14\.0 follow=on'
    timeout: 10000

# 4. 기어 P 뒤 시계를 6분 뒤로 옮긴다 → 종료됨. flush로 서버에 전량 올린다(점이 이미 올라갔으면 End만 보내 '종료 전송 완료')
- openLink: nubi-debug://signal?gear=P&now=${CLOCK_PLUS_6MIN}&flush=1
- extendedWaitUntil:
    visible: '종료됨'
    timeout: 20000
- extendedWaitUntil:
    visible: '마지막 업로드: (성공.*|종료 전송 완료)'
    timeout: 30000
- takeScreenshot: ${SHOT_DIR}/04-ended
